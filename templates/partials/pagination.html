{% load i18n %}
{% if is_paginated %}
  <nav class="pagination" aria-label="{% trans 'Пагінація' %}">
    {% if page_obj.has_previous %}
      <a href="?{{ query_string }}page={{ page_obj.previous_page_number }}">‹</a>
    {% else %}
      <span class="is-disabled">‹</span>
    {% endif %}
    {% for num in page_obj.paginator.page_range %}
      {% if num == page_obj.number %}
        <span class="is-current">{{ num }}</span>
      {% else %}
        <a href="?{{ query_string }}page={{ num }}">{{ num }}</a>
      {% endif %}
    {% endfor %}
    {% if page_obj.has_next %}
      <a href="?{{ query_string }}page={{ page_obj.next_page_number }}">›</a>
    {% else %}
      <span class="is-disabled">›</span>
    {% endif %}
  </nav>
{% endif %}

{% load i18n %}
{% if request.resolver_match.url_name == "cart" and request.resolver_match.namespace == "commerce" %}
  <span class="{{ btn_class|default:'icon-btn icon-btn--static' }}" aria-label="{% trans 'Кошик' %}" title="{% trans 'Ви вже на сторінці кошика' %}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M7 7h14l-1.5 9h-11L7 7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M7 7 6 3H3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="10" cy="20" r="1.3" fill="currentColor"/>
      <circle cx="17" cy="20" r="1.3" fill="currentColor"/>
    </svg>
    {% if show_label %}<span>{% trans "Кошик" %}</span>{% endif %}
    <span class="cart-count{% if not cart_items_count %} is-empty{% endif %}" id="{{ count_id }}" data-qa="cart-count">{% if cart_items_count %}{{ cart_items_count }}{% endif %}</span>
  </span>
{% else %}
  <button class="{{ btn_class|default:'icon-btn' }}" type="button" data-cart-open aria-label="{% trans 'Відкрити кошик' %}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M7 7h14l-1.5 9h-11L7 7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M7 7 6 3H3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="10" cy="20" r="1.3" fill="currentColor"/>
      <circle cx="17" cy="20" r="1.3" fill="currentColor"/>
    </svg>
    {% if show_label %}<span>{% trans "Кошик" %}</span>{% endif %}
    <span class="cart-count{% if not cart_items_count %} is-empty{% endif %}" id="{{ count_id }}" data-qa="cart-count">{% if cart_items_count %}{{ cart_items_count }}{% endif %}</span>
  </button>
{% endif %}
